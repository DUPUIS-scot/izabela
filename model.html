<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>5_4_2024 GLB Viewer</title>
  <meta name="description" content="Interactive web viewer for 5_4_2024.glb" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #111; color: #fff; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; background: radial-gradient(circle at 50% 35%, #2a2a2a, #090909 72%); }
    .bar {
      position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 2;
      display: flex; gap: 10px; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 14px; background: rgba(0,0,0,.62);
      backdrop-filter: blur(10px); font-size: 13px;
    }
    .bar a { color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.28); padding: 7px 10px; border-radius: 999px; }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <model-viewer
    src="assets/models/5_4_2024.glb"
    alt="3D model 5_4_2024"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1.15"
    environment-image="neutral"
    interaction-prompt="auto"
    touch-action="pan-y"
    ar>
  </model-viewer>
  <div class="bar">
    <span>5_4_2024.glb — drag to rotate · scroll/pinch to zoom</span>
    <a href="assets/models/5_4_2024.glb">GLB file</a>
  </div>
</body>
</html>
