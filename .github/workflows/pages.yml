name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble public GLB asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models
          cat .model-payload/part-* | base64 --decode > assets/models/5_4_2024.glb
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/models/5_4_2024.glb')
          data = p.read_bytes()
          if len(data) < 12 or data[:4] != b'glTF':
              raise SystemExit('Invalid GLB payload')
          print(f'GLB ready: {len(data)} bytes')
          PY
          rm -rf .model-payload

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
